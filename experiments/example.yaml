output_dir: results

defaults:
  pss_scale: 1.0
  sigmaP: 0.5
  sigmaN: 0.75
  resampling_iterations: 5
  grid_resolution: 100

experiments:
  - name: hand-dilation-sphere
    input: resources/hand2.ply
    operation: dilation
    structuring_element: sphere
    pse_scale: 2.5

  - name: hand-erosion-sphere
    input: resources/hand2.ply
    operation: erosion
    structuring_element: sphere
    pse_scale: 2.5

  - name: hand-dilation-cube
    input: resources/hand2.ply
    operation: dilation
    structuring_element: cube
    pse_scale: 2.5

  - name: hand-dilation-sphere-large
    input: resources/hand2.ply
    operation: dilation
    structuring_element: sphere
    pse_scale: 5.0
    sigmaP: 2.5
